name: Katabump Auto Renew

on:
  schedule:
  - cron: '0 0 * * *'  # 每天 UTC 0点 (北京时间 8点) 运行
  workflow_dispatch: # 允许手动触发

jobs:
  Renew-Katabump:
    runs-on: ubuntu-latest
    permissions:
      actions: write  
      contents: read
    
    steps:
    - uses: actions/checkout@v6
    - name: ⚙ 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 设置代理 (sing-box)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        if [ -n "$NODE_LINK" ]; then
          wget -qO setup_proxy.sh https://main.ssss.nyc.mn/setup_proxy.sh
          chmod +x setup_proxy.sh
          while IFS= read -r node; do
            node=$(echo "$node" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [ -z "$node" ] && continue
            [[ "$node" =~ ^# ]] && continue
            echo "=========================================="
            echo "🔄 尝试连接节点: $(echo "$node" | cut -d':' -f1) ..."
            if NODE_LINK="$node" bash setup_proxy.sh; then
              echo "✅ 代理节点启动并测试成功！"
              exit 0
            fi
            echo "⚠️ 该节点连接失败，尝试下一个备用节点..."
          done <<< "$NODE_LINK"
          echo "❌ 所有备用节点均连接失败"
          exit 1
        else
          echo "[INFO] 未配置代理，直连模式"
          echo "IS_PROXY=false" >> $GITHUB_ENV
        fi

    - name: 🚀 运行续期脚本
      env:
        KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        KATABUMP_ACCOUNTS: ${{ secrets.KATABUMP_ACCOUNTS }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py
        
    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done
